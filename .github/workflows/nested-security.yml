name: Nested application security validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'x402/**'
      - 'security/maintenance/**'
      - '.github/workflows/nested-security.yml'
  push:
    branches: [main, fix/2026-11-security-maintenance]
    paths:
      - 'packages/**'
      - 'x402/**'
      - 'security/maintenance/**'
      - '.github/workflows/nested-security.yml'
permissions:
  contents: read
concurrency:
  group: nested-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lock-owners:
    name: Strict owner (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - directory: "packages/generators/github-to-mcp"
            pnpm: "10.23.0"
          - directory: "packages/protocols/x402-coinbase/e2e"
            pnpm: "10.7.0"
          - directory: "packages/protocols/x402-coinbase/examples/typescript"
            pnpm: "10.7.0"
          - directory: "packages/protocols/x402-coinbase/typescript"
            pnpm: "10.7.0"
          - directory: "packages/protocols/x402-mcp-ts"
            pnpm: "9.0.0"
          - directory: "packages/protocols/x402-mcpay"
            pnpm: "9.12.0"
          - directory: "packages/protocols/x402-open-facilitator"
            pnpm: "9.14.2"
          - directory: "packages/protocols/x402-vercel-starter"
            pnpm: "9.15.4"
          - directory: "packages/tools/lyra-tool-discovery/dashboard"
            pnpm: "10.7.0"
          - directory: "x402/e2e"
            pnpm: "10.7.0"
          - directory: "x402/examples/typescript"
            pnpm: "10.7.0"
          - directory: "x402/typescript"
            pnpm: "10.7.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@${{ matrix.pnpm }} --ignore-scripts
      - name: Actual strict frozen install; errors remain blockers
        working-directory: ${{ matrix.directory }}
        run: node "$GITHUB_WORKSPACE/security/maintenance/run-check.cjs" strict-install
  generator:
    name: Generator security (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1']
    defaults:
      run:
        working-directory: packages/generators/github-to-mcp
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10.23.0 --ignore-scripts
      - name: Verify the disposable-network boundary
        run: node --test "$GITHUB_WORKSPACE/security/maintenance/disposable-network.test.cjs"
      - name: Strict frozen clean install
        run: node "$GITHUB_WORKSPACE/security/maintenance/run-check.cjs" strict-install
      - name: Full audit; critical findings block, other severities remain visible
        run: node "$GITHUB_WORKSPACE/security/maintenance/run-check.cjs" audit
      - name: Build all generator libraries without external services
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/security/maintenance/disposable-network.cjs
        run: node "$GITHUB_WORKSPACE/security/maintenance/run-check.cjs" libraries-build
      - name: Complete configured generator test suite
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/security/maintenance/disposable-network.cjs
        run: node "$GITHUB_WORKSPACE/security/maintenance/run-check.cjs" test
      - name: Workspace typechecks
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/security/maintenance/disposable-network.cjs
        run: node "$GITHUB_WORKSPACE/security/maintenance/run-check.cjs" typecheck
      - name: Web application typecheck
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/security/maintenance/disposable-network.cjs
        run: node "$GITHUB_WORKSPACE/security/maintenance/run-check.cjs" web-typecheck
      - name: Real configured lint
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/security/maintenance/disposable-network.cjs
        run: node "$GITHUB_WORKSPACE/security/maintenance/run-check.cjs" lint
      - name: Actual web application build
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/security/maintenance/disposable-network.cjs
        run: node "$GITHUB_WORKSPACE/security/maintenance/run-check.cjs" web-build
